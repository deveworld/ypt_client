name: Build Desktop Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true
        default: v0.1.1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            platform: linux
            asset: ypt_client-linux-x64
          - label: Windows x64
            os: windows-latest
            platform: windows
            asset: ypt_client-windows-x64
          - label: macOS x64
            os: macos-15-intel
            platform: macos
            asset: ypt_client-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter desktop app
        run: flutter build ${{ matrix.platform }} --release

      - name: Package Linux app
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="${ASSET}-${TAG}.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "dist/${archive}" .
          sha256sum "dist/${archive}" | sed "s#dist/##" > "dist/${archive}.sha256"

      - name: Package Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "$env:ASSET-$env:TAG.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File "dist/$archive.sha256" -Encoding ascii

      - name: Package macOS app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          app_bundle="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${app_bundle}" ]; then
            echo "No macOS .app bundle found" >&2
            exit 1
          fi
          archive="${ASSET}-${TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app_bundle}" "dist/${archive}"
          shasum -a 256 "dist/${archive}" | sed "s#dist/##" > "dist/${archive}.sha256"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
